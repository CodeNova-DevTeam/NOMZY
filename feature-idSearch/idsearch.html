<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOMZY : 아이디 찾기</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css" />
     <link rel="stylesheet" href="/feature-idSearch/idsearch.css">
     <script type="module" src="/feature-idSearch/idsearch.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
     
  </head>

  <body>
    <a href="/feature-main/main.html" class="logo">NOMZY</a>
    <!-- 이름 휴대전화 -->

    <form id="idSearchForm" name="idSearchForm">
      <div class="personalInformationSearch">
        <input id="userSearchName" name="searchName" class="inputBox" type="text" placeholder="이름"/>
        <span id="searchNameError" name="errorMessage"></span>

        <input id="userSearchEmail" name="searchEmail" class="inputBox" type="email" placeholder="e-mail"/>
        <span id="searchEmailError" name="errorMessage"></span>
      <!-- authenticationNumberButton : 인증번호버튼 -->
      <div class="authentication-group">
        <button id="authenticationNumberButton" name="userEmailCheckBytton" class="authentication-number-button" type="button">인증번호 받기</button>
        <input id="authenticationNumber" name="userCheckCode" class="inputBox" type="text" maxlength="6" placeholder="인증번호 (6자리 숫자)"/>
        <button id="verifyAuthCodeButton" class="verify-authcode-button" type="button">인증번호 확인</button>
        <span id="authenticationNumberError" name="errorMessage"></span>
      </div>

      <div class="buttonBox">
        <span id="idSearchError" class="error-message" style="color: red; display: none;"></span>
        <button id="idSearch" name="idSearch" class="nextButton" type="button">아이디 찾기</button>
      </div>
    </div>
</form>
  </body>
</html>
