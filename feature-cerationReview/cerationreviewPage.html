<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMZE : 리뷰작성</title>
    <link rel="stylesheet" href="/feature-cerationReview/cerationReviewPage.css">
    <script defer src="/feature-cerationReview/cerationReviewPage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <form class="reviewForm" id="reviewForm">
      <div id="reviewTargetCard">
         <strong id="reviewTargetFullInfo" style="font-size: 18px; font-weight: bold; color: #333;"></strong>
      </div>
      <h2>리뷰 작성</h2>

      <input type="hidden" id="restaurantId" name="restaurantId"/>
      <input type="hidden" id="region" name="region" />
      <input type="hidden" id="title" name="title" />
      <input type="hidden" id="category" name="category" />

      <div class="form-group">
        <label>별점 선택:</label>
          <div id="starRating" style="font-size: 24px; cursor: pointer;">
            <span data-score="1">☆</span>
            <span data-score="2">☆</span>
            <span data-score="3">☆</span>
            <span data-score="4">☆</span>
            <span data-score="5">☆</span>
          </div>
          <input type="hidden" id="rating" value="0" />
          <div id="ratingDisplay">선택한 별점: 0점</div>
          <div id="ratingError" class="error-message"></div>
      </div>

      <div class="form-group">
        <label for="reviewTitle">리뷰 제목:</label>
        <input type="text" id="reviewTitle" placeholder="최대 30자" required/>
        <div id="titleError" class="error-message"></div>
      </div>

      <div class="form-group">
        <label for="content">리뷰 내용:</label>
        <textarea id="content" rows="4" placeholder="최대 500자" required></textarea>
        <div id="contentError" class="error-message"></div>
      </div>

      <div class="form-group">
        <label for="image">이미지 업로드:</label>
        <input type="file" id="image" accept="image/*" multiple/>

        <div id="dropZone" style="border: 2px dashed #ccc; padding: 20px; margin-top: 10px; text-align: center;">
          여기에 이미지를 드래그하세요
        </div>
        <div id="imagePreviewContainer" style="display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;"></div>
      </div>

      <div class="form-group">
        <button id="submitButton" type="submit" disabled>리뷰 제출</button>
      </div>
  </form>
</body>
</html>
